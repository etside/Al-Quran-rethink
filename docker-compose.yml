# Miraz — single webapp (one origin: UI + API on :8000).
# The image ships with the database baked in; /data persists it across restarts.
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MIRAZ_DB=/data/miraz.db
      # Restrict browsers to this origin in production, e.g.:
      # - ALLOWED_ORIGINS=http://localhost:8000
    volumes:
      # Database only: baked-in miraz.db is copied here on first boot,
      # then survives restarts and image rebuilds.
      - miraz-data:/data

  # Phase 2 (larger datasets / write traffic): Postgres + hosted file store.
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: miraz
  #     POSTGRES_PASSWORD: miraz
  #     POSTGRES_DB: miraz
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #
  # graph:
  #   image: neo4j:5-community   # isnad narrator graph (optional profile)

volumes:
  miraz-data:
