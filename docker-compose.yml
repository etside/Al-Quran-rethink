services:
  backend:
    build: ./backend
    environment:
      - MIRAZ_DB=/data/miraz.db
    volumes:
      - miraz-data:/data
    # Phase 2: switch to Postgres by setting DATABASE_URL and uncommenting:
    #   DATABASE_URL=postgresql+psycopg2://miraz:miraz@db:5432/miraz
    expose:
      - "8000"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  # Phase 2 (narrator graphs + larger datasets):
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: miraz
  #     POSTGRES_PASSWORD: miraz
  #     POSTGRES_DB: miraz
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #
  # graph:
  #   image: neo4j:5-community   # isnad narrator graph (optional profile)

volumes:
  miraz-data:
